{% extends "base.html" %}
{% block main %}
<style>
    .articles-box { max-width: 800px; margin: 30px auto; }
    .articles-box h1 { text-align: center; margin-bottom: 20px; }
    .article-card { border: 1px solid #ccc; border-radius: 6px; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
    .article-card h3 { margin-top: 0; }
    .article-card p { white-space: pre-wrap; }
</style>

<div class="articles-box">
    <h1>Публичные статьи</h1>
    <hr>
    {% for article in articles %}
        <div class="article-card">
            <h3>{{ article.title }}</h3>
            <p>{{ article.article_text }}</p>
            <small style="color: gray;">Автор: Пользователь ID {{ article.login_id }}</small>
        </div>
    {% else %}
        <p style="text-align: center;">Публичных статей пока нет.</p>
    {% endfor %}
    <a href="/lab8/">← Назад в меню</a>
</div>
{% endblock %}
