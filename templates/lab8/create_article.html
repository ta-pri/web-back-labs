{% extends "base.html" %}

{% block main %}
<style>
    .create-box {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f9f9f9;
    }

    .create-box h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .create-box div {
        margin-bottom: 12px;
    }

    .create-box input[type="text"],
    .create-box textarea {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        resize: vertical;
    }

    .create-box textarea {
        min-height: 150px;
    }

    .create-box button {
        width: 100%;
        padding: 8px;
        background: #5bc0de;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .create-box button:hover {
        background: #31b0d5;
    }

    .error {
        color: red;
        text-align: center;
        margin-bottom: 10px;
    }
</style>

<div class="create-box">
    <h1>Создание статьи</h1>

    <form method="post">
        <div>
            <label>Название</label>
            <input type="text" name="title">
        </div>

        <div>
            <label>Текст</label>
            <textarea name="text"></textarea>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <button type="submit">Создать</button>
    </form>
</div>
{% endblock %}
