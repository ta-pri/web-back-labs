{% extends "base.html" %}

{% block main %}
<style>
    .edit-box {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f9f9f9;
    }

    .edit-box h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .edit-box div {
        margin-bottom: 12px;
    }

    .edit-box input[type="text"],
    .edit-box textarea {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        resize: vertical;
    }

    .edit-box textarea {
        min-height: 150px;
    }

    .edit-box button {
        width: 100%;
        padding: 8px;
        background: #f0ad4e;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .edit-box button:hover {
        background: #ec971f;
    }
</style>

<div class="edit-box">
    <h1>Редактирование статьи</h1>

    <form method="post">
        <div>
            <label>Название</label>
            <input type="text" name="title" value="{{ article.title }}">
        </div>

        <div>
            <label>Текст</label>
            <textarea name="text">{{ article.article_text }}</textarea>
        </div>
        <div>
            <label>
                <input type="checkbox" name="is_public" {% if article.is_public %}checked{% endif %}> Публичная статья
            </label>
        </div>
        <button type="submit">Сохранить</button>
    </form>
</div>
{% endblock %}
